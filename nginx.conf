server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Required headers for Godot SharedArrayBuffer / WASM threads
    add_header Cross-Origin-Opener-Policy "same-origin";
    add_header Cross-Origin-Embedder-Policy "require-corp";

    # Gzip compression
    gzip on;
    gzip_static on;
    gzip_types application/wasm application/javascript text/html application/octet-stream;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # Cache static assets aggressively except index.html
    location = /index.html {
        add_header Cross-Origin-Opener-Policy "same-origin";
        add_header Cross-Origin-Embedder-Policy "require-corp";
        add_header Cache-Control "no-cache";
    }

    location ~* \.(wasm|pck|js|png)$ {
        add_header Cross-Origin-Opener-Policy "same-origin";
        add_header Cross-Origin-Embedder-Policy "require-corp";
        add_header Cache-Control "public, max-age=3600";
    }
}
